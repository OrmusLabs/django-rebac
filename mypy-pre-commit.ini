# mypy-pre-commit.ini
[mypy]
python_version = 3.12

# Required for the src/ layout. Without it the only package base is the repo root, so
# src/rebac/x.py is named `src.rebac.x` -- while an installed (editable) rebac makes the
# same file reachable as `rebac.x`, and mypy aborts with "Source file found twice under
# different module names". Pre-commit never hit this because its mypy runs in an isolated
# env where the package is not installed; CI runs inside the project venv, where it is.
mypy_path = src

namespace_packages = True
explicit_package_bases = True
ignore_missing_imports = True
disable_error_code = import-untyped,import-not-found


# Migrations are auto-generated. Both spellings are kept so the override holds whichever
# package base mypy resolves the files against.
[mypy-rebac.migrations.*]
ignore_errors = True

[mypy-src.*.migrations.*]
ignore_errors = True
